name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 运行测试
        run: python -m unittest discover -s tests -v